<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.03"/>
    </linearGradient>

    <!-- Text Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Lens Ring Glow -->
    <filter id="cyan-glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Pulsing Lens Animation -->
    <style>
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.5; }
        50% { transform: scale(1.05); opacity: 0.9; }
        100% { transform: scale(0.95); opacity: 0.5; }
      }
      @keyframes rotateIris {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
      @keyframes floatPill {
        0% { transform: translateY(0px); }
        50% { transform: translateY(-8px); }
        100% { transform: translateY(0px); }
      }
      .animated-ring {
        transform-origin: 1020px 180px;
        animation: pulseRing 4s infinite ease-in-out;
      }
      .animated-iris {
        transform-origin: 1020px 180px;
        animation: rotateIris 25s linear infinite;
      }
      .floating-pill-1 {
        animation: floatPill 5s ease-in-out infinite;
      }
      .floating-pill-2 {
        animation: floatPill 6s ease-in-out infinite 1s;
      }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>

  <!-- Dynamic Background Grid / Tech Overlay -->
  <g opacity="0.08">
    <path d="M0 60 H1200 M0 120 H1200 M0 180 H1200 M0 240 H1200 M0 300 H1200" stroke="#ffffff" stroke-width="1"/>
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360" stroke="#ffffff" stroke-width="1"/>
  </g>

  <!-- Background Lens Geometry (Dynamic Graphic Elements in Right Corner) -->
  <g class="animated-ring">
    <circle cx="1020" cy="180" r="140" stroke="#38bdf8" stroke-width="2" fill="none" opacity="0.3" filter="url(#cyan-glow)"/>
    <circle cx="1020" cy="180" r="110" stroke="#818cf8" stroke-width="3" stroke-dasharray="12 8" fill="none" opacity="0.5"/>
  </g>

  <g class="animated-iris">
    <polygon points="1020,100 1060,140 1020,180 980,140" fill="#38bdf8" opacity="0.15"/>
    <polygon points="1100,180 1060,220 1020,180 1060,140" fill="#818cf8" opacity="0.15"/>
    <polygon points="1020,260 980,220 1020,180 1060,220" fill="#c084fc" opacity="0.15"/>
    <polygon points="940,180 980,140 1020,180 980,220" fill="#38bdf8" opacity="0.15"/>
  </g>

  <circle cx="1020" cy="180" r="50" fill="#0f172a" stroke="#38bdf8" stroke-width="4" filter="url(#cyan-glow)"/>
  <circle cx="1020" cy="180" r="22" fill="#38bdf8" opacity="0.8"/>
  <circle cx="1030" cy="170" r="6" fill="#ffffff" opacity="0.9"/>

  <!-- Dynamic Decorative Pills (Background Layer) -->
  <g class="floating-pill-1" opacity="0.85">
    <rect x="720" y="50" width="170" height="38" rx="19" fill="url(#card-grad)" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="742" cy="69" r="6" fill="#22c55e"/>
    <text x="758" y="74" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">4K &amp; PTZ AI Control</text>
  </g>

  <g class="floating-pill-2" opacity="0.85">
    <rect x="650" y="270" width="200" height="38" rx="19" fill="url(#card-grad)" stroke="#818cf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="672" cy="289" r="6" fill="#38bdf8"/>
    <text x="688" y="294" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#e2e8f0">Virtual Camera Drivers</text>
  </g>

  <!-- Foreground Content Container (Guaranteed Foreground) -->
  <g transform="translate(60, 0)">
    <!-- Main Title Badge -->
    <rect x="0" y="65" width="220" height="32" rx="16" fill="#38bdf8" fill-opacity="0.15" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1"/>
    <text x="16" y="86" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38bdf8" letter-spacing="1">CURATED ECOSYSTEM</text>

    <!-- Main Title -->
    <text x="0" y="148" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="800" fill="#ffffff" filter="url(#glow)">
      Awesome Webcam Peripheral
    </text>

    <!-- Subtitle -->
    <text x="0" y="195" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="400" fill="#94a3b8">
      Top Commercial SaaS &amp; Open-Source Software for Cameras, AI &amp; Virtual Feeds
    </text>

    <!-- Feature Highlights / Tags -->
    <g transform="translate(0, 235)">
      <!-- Tag 1 -->
      <rect x="0" y="0" width="135" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="14" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#38bdf8">📹 UVC / V4L2</text>

      <!-- Tag 2 -->
      <rect x="147" y="0" width="155" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="161" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#a855f7">🤖 AI Auto-Framing</text>

      <!-- Tag 3 -->
      <rect x="314" y="0" width="150" height="36" rx="8" fill="#1e293b" stroke="#334155" stroke-width="1"/>
      <text x="328" y="23" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="600" fill="#22c55e">⚡ Virtual Output</text>
    </g>
  </g>
</svg>
